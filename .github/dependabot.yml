version: 2
updates:
  - package-ecosystem: gradle
    directory: "/HomelabAndroid"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      android-build:
        patterns: ["com.android.*", "org.jetbrains.kotlin.*", "com.google.devtools.ksp"]
      compose:
        patterns: ["androidx.compose*", "androidx.activity*", "androidx.navigation*"]
      networking:
        patterns: ["com.squareup.retrofit2*", "com.squareup.okhttp3*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
