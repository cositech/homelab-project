name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase0-audit:
    name: Phase 0 static audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run repository audit
        run: ./scripts/phase0-audit.sh

  upstream-invariants:
    name: Upstream invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check iOS and Android versions match
        run: |
          python3 - <<'PY'
          import pathlib
          import plistlib
          import re
          import sys

          root = pathlib.Path.cwd()
          gradle = (root / "HomelabAndroid/app/build.gradle.kts").read_text()
          plist_path = root / "HomelabSwift/Homelab/Info.plist"

          version_name = re.search(r'versionName\s*=\s*"([^"]+)"', gradle)
          version_code = re.search(r'versionCode\s*=\s*(\d+)', gradle)
          if not version_name or not version_code:
              print("Could not read Android versionName/versionCode", file=sys.stderr)
              sys.exit(1)

          with plist_path.open("rb") as fp:
              info = plistlib.load(fp)

          ios_version = str(info.get("CFBundleShortVersionString", ""))
          ios_build = str(info.get("CFBundleVersion", ""))
          if ios_version != version_name.group(1) or ios_build != version_code.group(1):
              print(
                  f"Version mismatch: iOS {ios_version} ({ios_build}) vs "
                  f"Android {version_name.group(1)} ({version_code.group(1)})",
                  file=sys.stderr,
              )
              sys.exit(1)

          print(f"Versions match: {ios_version} ({ios_build})")
          PY
      - name: Ensure release binaries are not tracked
        run: |
          tracked="$(git ls-files '*.ipa' '*.apk' '*.aab')"
          if [ -n "$tracked" ]; then
            echo "Release binaries must not be committed:"
            echo "$tracked"
            exit 1
          fi

  gradle-wrapper:
    name: Validate Gradle wrapper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: gradle/actions/wrapper-validation@v4

  android:
    name: Android unit tests and debug build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [phase0-audit, upstream-invariants, gradle-wrapper]
    defaults:
      run:
        working-directory: HomelabAndroid
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6.1.0
      - name: Unit tests
        run: ./gradlew --no-daemon --console=plain :app:testDebugUnitTest
      - name: Build debug
        run: ./gradlew --no-daemon --console=plain :app:assembleDebug

  ios:
    name: iOS unit tests and simulator build
    runs-on: macos-26
    timeout-minutes: 30
    needs: [phase0-audit, upstream-invariants]
    defaults:
      run:
        working-directory: HomelabSwift
    steps:
      - uses: actions/checkout@v5
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Create CI signing config
        run: |
          mkdir -p Config
          cat > Config/Signing.xcconfig <<'EOF'
          DEVELOPMENT_TEAM =
          PRODUCT_BUNDLE_IDENTIFIER = homelab.foreverhomelab
          EOF
      - name: Select simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          UDID="$(python3 - <<'PY'
          import json, subprocess
          data=json.loads(subprocess.check_output(["xcrun","simctl","list","devices","available","-j"]))
          candidates=[]
          for runtime, devices in data.get("devices", {}).items():
              if "iOS" not in runtime:
                  continue
              for d in devices:
                  if d.get("isAvailable") and d.get("name", "").startswith("iPhone"):
                      candidates.append((runtime, d["name"], d["udid"]))
          if not candidates:
              raise SystemExit("No available iPhone simulator found")
          candidates.sort(reverse=True)
          print(candidates[0][2])
          PY
          )"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Unit tests
        run: >
          xcodebuild test
          -project Homelab.xcodeproj
          -scheme Homelab
          -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}"
          -derivedDataPath "$RUNNER_TEMP/homelab-ios-test-dd"
          CODE_SIGNING_ALLOWED=NO
      - name: Build simulator
        run: >
          xcodebuild build
          -project Homelab.xcodeproj
          -scheme Homelab
          -configuration Debug
          -sdk iphonesimulator
          -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}"
          -derivedDataPath "$RUNNER_TEMP/homelab-ios-build-dd"
          CODE_SIGNING_ALLOWED=NO
