name: CodeQL
on:
  push: {branches: [main]}
  pull_request: {branches: [main]}
  schedule:
    - cron: "17 3 * * 1"
permissions:
  contents: read
  security-events: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "21"}
      - uses: github/codeql-action/init@v3
        with: {languages: java-kotlin, build-mode: manual}
      - working-directory: HomelabAndroid
        run: ./gradlew :app:compileDebugKotlin --console=plain
      - uses: github/codeql-action/analyze@v3
  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v3
        with: {languages: swift, build-mode: manual}
      - name: Create CI signing config
        working-directory: HomelabSwift
        run: |
          mkdir -p Config
          printf 'DEVELOPMENT_TEAM =\nPRODUCT_BUNDLE_IDENTIFIER = homelab.foreverhomelab\n' > Config/Signing.xcconfig
      - name: Build iOS
        working-directory: HomelabSwift
        run: xcodebuild build -project Homelab.xcodeproj -scheme Homelab -configuration Debug -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath /tmp/codeql-ios CODE_SIGNING_ALLOWED=NO
      - uses: github/codeql-action/analyze@v3
