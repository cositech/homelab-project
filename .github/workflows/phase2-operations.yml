name: Phase 2 Operations

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  operations-invariants:
    name: Phase 2 operations invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate normalized operations contracts and views
        run: bash ./scripts/phase2-operations-audit.sh
