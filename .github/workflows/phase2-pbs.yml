name: Phase 2 PBS Provider

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pbs-provider-invariants:
    name: Phase 2 PBS provider invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate read-only PBS provider contract
        run: bash ./scripts/phase2-pbs-audit.sh
