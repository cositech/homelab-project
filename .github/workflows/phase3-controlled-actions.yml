name: Phase 3 Controlled Actions

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  controlled-actions:
    name: Phase 3 controlled action invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/phase3-controlled-actions-audit.sh
