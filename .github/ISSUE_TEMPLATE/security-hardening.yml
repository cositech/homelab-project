name: Security hardening
description: Track non-confidential structural security improvements.
title: "security: "
labels: [security]
body:
  - type: markdown
    attributes: {value: "Do not submit exploitable vulnerabilities here; use private reporting."}
  - type: textarea
    id: invariant
    attributes: {label: Security invariant and current gap}
    validations: {required: true}
  - type: textarea
    id: acceptance
    attributes: {label: Acceptance and negative tests}
    validations: {required: true}
  - type: textarea
    id: migration
    attributes: {label: Migration, compatibility and rollback}
