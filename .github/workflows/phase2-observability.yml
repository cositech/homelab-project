name: Phase 2 Observability Providers

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  observability-provider-invariants:
    name: Phase 2 observability provider invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate read-only Prometheus and Grafana contracts
        run: bash ./scripts/phase2-observability-audit.sh
