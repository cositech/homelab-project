version: 2
updates:
  - package-ecosystem: gradle
    directory: /HomelabAndroid
    schedule: {interval: weekly, day: monday, time: "04:00", timezone: Europe/Berlin}
    open-pull-requests-limit: 10
    labels: [dependencies, android]
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly, day: monday, time: "04:30", timezone: Europe/Berlin}
    open-pull-requests-limit: 10
    labels: [dependencies, ci]
